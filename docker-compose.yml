services:
  mongodb:
    image: mongo:7
    container_name: replyflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: replyflow

  redis:
    image: redis:7-alpine
    container_name: replyflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory-policy noeviction

volumes:
  mongodb_data:
  redis_data:
